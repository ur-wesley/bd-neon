name: Release

"on":
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Override version for asset names (default: Cargo.toml package version)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  windows-exe:
    name: Build Windows exe
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Derive version
        id: version
        shell: pwsh
        run: |
          $cargoVersion = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"').Matches.Groups[1].Value
          Write-Host "Cargo.toml version: $cargoVersion"

          $tag = "${{ github.ref_name }}"
          $isTag = "${{ github.ref_type }}" -eq "tag"
          $inputVersion = "${{ inputs.version }}"

          if ($isTag) {
            $version = $tag -replace '^v', ''
            Write-Host "Tag build: ref_name=$tag -> version=$version"
            if ($version -ne $cargoVersion) {
              Write-Error "Tag version '$version' does not match Cargo.toml version '$cargoVersion'. Tag must match Cargo.toml (bump.config.ts bumps Cargo.toml, so create tag v<cargo-version>)."
              exit 1
            }
          } elseif ($inputVersion -ne "") {
            $version = $inputVersion -replace '^v', ''
            Write-Host "Manual dispatch with input version: $version (Cargo.toml: $cargoVersion)"
          } else {
            $version = $cargoVersion
            Write-Host "Manual dispatch: falling back to Cargo.toml version $version"
          }

          "version=$version" >> $env:GITHUB_OUTPUT
          "cargo_version=$cargoVersion" >> $env:GITHUB_OUTPUT

      - name: Build release (locked)
        run: cargo build --release --locked

      - name: Stage versioned exe
        id: package
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $exe = "bd-neon-$version-x86_64-pc-windows-msvc.exe"
          Copy-Item target/release/bd-neon.exe "dist/$exe"
          Get-ChildItem dist/
          "exe=$exe" >> $env:GITHUB_OUTPUT

      - name: Upload exe artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist/*.exe
          if-no-files-found: error

  macos-dmg:
    name: Build macOS ARM64 dmg
    runs-on: macos-14
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Derive version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          cargo_version=$(sed -n 's/^version *= *"\([^"]*\)"/\1/p' Cargo.toml | head -n1)
          echo "Cargo.toml version: $cargo_version"

          tag="${{ github.ref_name }}"
          is_tag="${{ github.ref_type }}"
          input_version="${{ inputs.version }}"
          if [ "$is_tag" = "tag" ]; then
            version="${tag#v}"
            echo "Tag build: ref_name=$tag -> version=$version"
            if [ "$version" != "$cargo_version" ]; then
              echo "Tag version '$version' does not match Cargo.toml version '$cargo_version'." >&2
              exit 1
            fi
          elif [ -n "$input_version" ]; then
            version="${input_version#v}"
            echo "Manual dispatch with input version: $version (Cargo.toml: $cargo_version)"
          else
            version="$cargo_version"
            echo "Manual dispatch: falling back to Cargo.toml version $version"
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "cargo_version=$cargo_version" >> "$GITHUB_OUTPUT"

      - name: Build release (locked, aarch64)
        shell: bash
        run: |
          set -euo pipefail
          rustup target add aarch64-apple-darwin
          cargo build --release --locked --target aarch64-apple-darwin

      - name: Bundle .app and create dmg
        id: package
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          app="BdNeon.app"
          dmg="bd-neon-$version-aarch64-apple-darwin.dmg"
          rm -rf "$app" dist
          mkdir -p "$app/Contents/MacOS" dist
          cp "target/aarch64-apple-darwin/release/bd-neon" "$app/Contents/MacOS/bd-neon"
          chmod +x "$app/Contents/MacOS/bd-neon"
          cat > "$app/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key>
            <string>bd-neon</string>
            <key>CFBundleDisplayName</key>
            <string>bd-neon</string>
            <key>CFBundleIdentifier</key>
            <string>dev.bd-neon.bd-neon</string>
            <key>CFBundleExecutable</key>
            <string>bd-neon</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleVersion</key>
            <string>$version</string>
            <key>CFBundleShortVersionString</key>
            <string>$version</string>
            <key>LSMinimumSystemVersion</key>
            <string>13.0</string>
          </dict>
          </plist>
          EOF
          hdiutil create -volname "bd-neon-$version" -srcfolder "$app" -ov -format UDZO "dist/$dmg"
          ls -la dist/
          echo "dmg=$dmg" >> "$GITHUB_OUTPUT"

      - name: Upload dmg artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: dist/*.dmg
          if-no-files-found: error

  publish:
    name: Publish release (exe + dmg only)
    runs-on: ubuntu-latest
    needs: [windows-exe, macos-dmg]
    steps:
      - name: Download Windows exe artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-exe
          path: dist

      - name: Download macOS dmg artifact
        uses: actions/download-artifact@v4
        with:
          name: macos-dmg
          path: dist

      - name: List release assets
        shell: bash
        run: |
          set -euo pipefail
          ls -la dist/
          echo "Release assets (exe + dmg only):"
          ls -1 dist/

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('manual-{0}', needs.windows-exe.outputs.version) }}
          name: bd-neon ${{ needs.windows-exe.outputs.version }}
          generate_release_notes: true
          files: |
            dist/*
